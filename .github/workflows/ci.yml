name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared packages are `file:` dependencies of all five services and have
  # to be built before anything can typecheck against them, so they get their
  # own job that everything else waits on.
  packages:
    name: shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm --prefix packages/shared-events install --no-audit --no-fund
          npm --prefix packages/shared-observability install --no-audit --no-fund
      - name: Build
        run: |
          npm --prefix packages/shared-events run build
          npm --prefix packages/shared-observability run build
      - name: Test
        run: |
          npm --prefix packages/shared-events test
          npm --prefix packages/shared-observability test

  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: packages
    strategy:
      # One service failing should not hide the state of the other four.
      fail-fast: false
      matrix:
        service:
          - auth-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shared packages
        run: |
          npm --prefix packages/shared-events install --no-audit --no-fund
          npm --prefix packages/shared-observability install --no-audit --no-fund
          npm --prefix packages/shared-events run build
          npm --prefix packages/shared-observability run build

      - name: Install
        run: npm --prefix ${{ matrix.service }} install --no-audit --no-fund

      - name: Typecheck
        run: npx --prefix ${{ matrix.service }} tsc --noEmit -p ${{ matrix.service }}/tsconfig.json

      - name: Test
        # The suites mock their I/O, so no Postgres or RabbitMQ is needed here.
        # The env vars satisfy the Zod schema that each service validates at
        # import time; without them the process exits before a test can run.
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: ci
          JWT_SECRET: ci-only-secret-not-used-for-anything-real
          SERVICE_TOKEN: ci-only-service-token-not-real
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
        run: npm --prefix ${{ matrix.service }} test

      - name: Build
        run: npm --prefix ${{ matrix.service }} run build

  images:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          # Nothing is pushed: this proves the image still builds, which is
          # the thing that silently rots when a dependency or path changes.
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose:
    name: compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        # Catches a malformed compose file or a missing interpolation without
        # starting anything.
        env:
          JWT_SECRET: ci-placeholder
          SERVICE_TOKEN: ci-placeholder
          STRIPE_SECRET_KEY: ci-placeholder
        run: docker compose config --quiet
